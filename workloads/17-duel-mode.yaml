      - FPS/Part 數量實測（設計預算：<=300 Part、<=20 燈、目標 FPS>=50）

recovery:
  - "DuelQueuePortal 觸碰無反應 → 確認 workspace.LastZone.Lobby.DuelQueuePortal 存在，且 DuelService 的 task.spawn WaitForChild 沒有卡住"
  - "投票 UI 沒開啟 → 檢查 DuelVoteOpen RemoteEvent 是否在 GameEventsBootstrap 建立"
  - "地圖找不到 → workspace.LastZone.DuelArenas.<MapId> 是否存在；MapBuilder.buildDuelArenas 是否有跑"
  - "傷害沒生效 → 確認 session.State == 'Combat'（倒數/投票期間傷害本來就該被擋）"
  - "殘留佇列/對決狀態 → 檢查 Players.PlayerRemoving 與 PhaseChangedServer(PvE) 清理路徑"

# ============= 依賴 =============
dependencies:
  upstream:
    - GameConfig.WEAPONS / MAX_HP / STARTING_RESERVE_MAGAZINES / DUEL
    - ReloadLogic (ServerStorage, 純邏輯重用)
    - ShopService.getPrimary (決鬥武器＝玩家目前裝備的主武器)
    - MatchManager.attachWeapon / PhaseChangedServer / MatchRunning / getPlayerData (讀取重用)
  downstream:
    - DuelVoteUI.lua (client, 依 DuelMaps 清單動態渲染)
    - MatchManager.startMatch / teleportToArena / resetToLobby (新增 isDueling 排除 guard，呼叫 DuelService.isDueling 唯讀查詢)
