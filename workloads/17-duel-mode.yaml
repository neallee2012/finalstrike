success_criteria:
  - "現有 12 人 Lobby → PvE → PvP → MatchEnd 狀態機、規則、獎勵完全不變（MatchManager 只多了 3 處 isDueling 排除 guard，非重構）"
  - "兩位玩家排隊、配對、投票皆正確；重複/逾時/非參與者投票被拒絕"
  - "平票時決勝有隨機性（DuelMaps.spec.lua 200~300 次抽樣涵蓋所有平票地圖）；單一地圖時 resolveVote 100% 決定性"
  - "倒數/出生保護期間無法造成傷害（FireWeapon 監聽器以 session.State==Combat 把關）"
  - "淘汰與斷線都恰好觸發一次結算（session.Ended 冪等guard）"
  - "對決結束後雙方 HP/彈藥/Phase/鏡頭狀態/Tool 完全清理，回到大廳"
  - "重新排隊可以進行第二場對決，不殘留前一場狀態"
  - "非對決/非 12 人賽玩家不受影響"

verification:
  automated: "DuelMaps.spec.lua 已寫好（TestEZ，需啟用 Tests/Runner.server.lua 才會執行 — 與既有 CurrencyMath/ReloadLogic 套件一致）"
  studio_live_playtest: |
    本次 session 未偵測到已連線的 Roblox Studio MCP 實例
    （roblox-studio-list_roblox_studios 回傳空陣列），因此未執行雙人
    Server & Clients 實機測試。以下驗收項目尚未有實機證據，需要下一個
    有 Studio 連線的 session 補測：
      - 佇列/配對/投票 UI 實際顯示與點擊
      - 平票隨機性在真實 Studio 環境重現
      - 倒數期間無敵、開戰後正常傷害
      - 淘汰/斷線流程與清理後可重新排隊
